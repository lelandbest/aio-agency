version: "3.8"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8001:8001"
    volumes:
      - ./backend/data:/app/backend/data
    environment:
      - FFMPEG_PATH=/usr/bin/ffmpeg
      - ENVIRONMENT=production
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: ../Dockerfile.frontend
    ports:
      - "5175:80"
    depends_on:
      - backend
    restart: unless-stopped